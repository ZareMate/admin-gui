type="optional"
versionRange="[1,)"
ordering="AFTER"
side="SERVER"

[[dependencies.${mod_id}]]
modId="discordlink"
type="optional"
versionRange="[1,)"
ordering="AFTER"
side="SERVER"

[[dependencies.${mod_id}]]

name: Generate GUI Textures

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate textures
        run: python tools/generate_gui_textures.py

      - name: Commit generated textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/assets/admin_gui/textures/gui
          if git diff --cached --quiet; then
            echo "No texture changes."
            exit 0
          fi
          git commit -m "Generate GUI texture assets [skip ci]"
          git push
